[project]
name = "task-validation"
version = "0.1.0"
description = "Statistical certification of agent-evaluation benchmark validity under a bounded human-review budget."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Evan K" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
fit = ["scikit-learn>=1.5", "pandas>=2.0", "pyarrow>=15", "numpy>=1.26"]

[project.scripts]
task-validation = "task_validation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
